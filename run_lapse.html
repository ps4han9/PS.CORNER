<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS.CORNER - Lapse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --corner-primary: #00e5ff; --corner-secondary: #ff007f; --dark-bg: rgba(10, 15, 25, 0.95); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; background: #050510; color: #fff; font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden; }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top left, rgba(0, 229, 255, 0.15) 0%, transparent 60%), radial-gradient(circle at bottom right, rgba(255, 0, 127, 0.15) 0%, transparent 50%); z-index: 0; }
  .hud-container { position: relative; z-index: 1; width: 95%; max-width: 900px; background: var(--dark-bg); border-top: 3px solid var(--corner-primary); border-bottom: 3px solid var(--corner-secondary); border-radius: 15px; padding: 40px 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 30px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(255, 0, 127, 0.1); overflow: hidden; }
  .brand-title { font-family: 'Orbitron', sans-serif; font-size: 5rem; font-weight: 900; text-align: center; margin-bottom: 5px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 20px var(--corner-primary), 2px 2px 0px var(--corner-secondary); direction: ltr; }
  .brand-sub { font-size: 1.6rem; text-align: center; color: #e0e0e0; font-weight: 900; letter-spacing: 1px; margin-bottom: 25px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.8); }
  
  .contact-info { text-align: center; font-size: 1.1rem; color: #d0d0d0; margin-bottom: 25px; direction: rtl; line-height: 1.8; border-radius: 10px; padding: 20px; background: rgba(0, 0, 0, 0.6); border: 1px dashed rgba(255, 0, 127, 0.5); box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
  .contact-info .address { font-size: 1.3rem; color: var(--corner-primary); font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 8px rgba(0, 229, 255, 0.4); border-bottom: 1px solid #333; padding-bottom: 10px; }
  .contact-info span { color: var(--corner-secondary); font-weight: 900; margin-left: 5px; }
  .contact-info .phones { direction: ltr; display: inline-block; font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: #fff; text-shadow: 0 0 10px var(--corner-primary); font-weight: bold; margin-top: 5px; }

  .status-panel { background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 8px; border: 1px solid #222; border-right: 5px solid var(--corner-primary); border-left: 5px solid var(--corner-secondary); margin-bottom: 20px; position: relative; }
  .status-panel::before { content: 'EXECUTION'; position: absolute; top: -12px; left: 15px; background: var(--corner-secondary); color: #fff; padding: 2px 10px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 4px; box-shadow: 0 0 8px var(--corner-secondary); }
  #state { font-size: 24px; font-weight: 900; color: #fff; text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: var(--corner-primary); border-radius: 50%; box-shadow: 0 0 10px var(--corner-primary); animation: bounce 0.8s infinite alternate; }
  .dot:nth-child(2) { background: var(--corner-secondary); box-shadow: 0 0 10px var(--corner-secondary); animation-delay: 0.2s; } 
  .dot:nth-child(3) { background: #fff; box-shadow: 0 0 10px #fff; animation-delay: 0.4s; }
  @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }
  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(5, 5, 10, 0.8); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 8px; padding: 15px; min-height: 150px; max-height: 250px; overflow-y: auto; color: #d0d0d0; direction: ltr; text-align: left; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
  #out::-webkit-scrollbar { width: 6px; } #out::-webkit-scrollbar-track { background: #111; border-radius: 10px; } #out::-webkit-scrollbar-thumb { background: var(--corner-primary); border-radius: 5px; }
  .footer-sys { position: fixed; bottom: 10px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 2; direction: ltr; }
  @media (max-width: 600px) { .brand-title { font-size: 3.5rem; } .brand-sub { font-size: 1.2rem; } .contact-info { font-size: 0.95rem; } .contact-info .phones { font-size: 1.4rem; } .contact-info .address { font-size: 1.1rem; } #out { min-height: 100px; max-height: 200px; } }
</style>
</head>
<body>
<div class="hud-container">
  <h1 class="brand-title">PS.CORNER</h1>
  <div class="brand-sub">LAPSE EXPLOIT</div>
  
  <div class="contact-info">
    <div class="address">📍 المنصورة - العباسي خلف مديرية الأمن - سنتر البنزينة الدور الثاني</div>
    <div><span>📞 للتواصل:</span> <br><div class="phones">01009203828</div></div>
  </div>

  <div class="status-panel"><div id="state"><span id="stateText">⏳ جارٍ تحميل سلسلة Lapse...</span><div class="loader-wrapper"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>
  <div id="out"></div>
</div>
<div class="footer-sys">PS.CORNER v1.0 - Lapse</div>
<script type="module">
  import "./chain_lapse.js";
</script>
</body>
</html>
